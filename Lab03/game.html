<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Гра — Вгадай число</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 480px;
      margin: 3rem auto;
      padding: 1rem;
      line-height: 1.5;
    }
    h1 { color: #0a8b0e; }
    input { padding: 8px; font-size: 1rem; width: 100px; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
    #message { font-size: 1.2rem; min-height: 1.5em; }
    .error { color: #b00; }
    .success { color: #0a7d35; }
  </style>
</head>
<body>

  <h1>Вгадай число від 1 до 100</h1>

  <p>Маєш <strong>7 спроб</strong>. Введи число і натисни кнопку.</p>

  <div>
    <input id="guess" type="number" min="1" max="100" autofocus>
    <button id="submit">Перевірити</button>
  </div>

  <p id="message"></p>
  <p id="attempts"></p>

  <script>

    const inputEl = document.getElementById('guess');
    const submitBtn = document.getElementById('submit');
    const messageEl = document.getElementById('message');
    const attemptsEl = document.getElementById('attempts');

    let secretNumber;
    let attemptsLeft;
    let isGameOver;

    function startNewGame() {
        secretNumber = Math.floor(Math.random() * 100) + 1;
        attemptsLeft = 7;
        isGameOver = false;

        inputEl.value = '';
        inputEl.disabled = false;
        submitBtn.textContent = 'Перевірити';
        messageEl.textContent = '';
        messageEl.className = '';
        updateAttemptsDisplay();
        inputEl.focus();
    }

    function processGuess(userNumber) {
        if (userNumber === '' || isNaN(userNumber) || userNumber < 1 || userNumber > 100) {
            return { status: 'error', text: 'Помилка: введи число від 1 до 100!' };
        }
    attemptsLeft--; 

        if (userNumber === secretNumber) {
            isGameOver = true;
            return { status: 'win', text: 'Вгадав! ' };
        }

        if (attemptsLeft === 0) {
            isGameOver = true;
            return { status: 'lose', text: `Поразка! Загадане число було: ${secretNumber}` };
        }

        if (userNumber > secretNumber) {
            return { status: 'continue', text: 'Менше' };
        } else {
            return { status: 'continue', text: 'Більше' };
        }
    }

    function handleAction() {
        if (isGameOver) {
            startNewGame();
            return;
        }

        const rawInput = inputEl.value.trim();
        const parsedNumber = rawInput !== '' ? parseInt(rawInput) : NaN;

        const result = processGuess(parsedNumber);

        messageEl.textContent = result.text;

        if (result.status === 'error') {
            messageEl.className = 'error';
            return; 
        }

        updateAttemptsDisplay();
        inputEl.value = '';
        inputEl.focus();

        if (result.status === 'win') {
            messageEl.className = 'success';
            submitBtn.textContent = 'Грати ще раз';
            inputEl.disabled = true;
        } else if (result.status === 'lose') {
            messageEl.className = 'error';
            submitBtn.textContent = 'Грати ще раз';
            inputEl.disabled = true;
        } else {
            messageEl.className = '';
        }
    }

    function updateAttemptsDisplay() {
        attemptsEl.innerHTML = `Залишилось спроб: <strong>${attemptsLeft}</strong>`;
    }

    submitBtn.addEventListener('click', handleAction);
    inputEl.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleAction();
    });
    startNewGame();

  </script>

</body>
</html>
