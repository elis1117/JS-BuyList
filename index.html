<!DOCTYPE html>
<html>
<head lang="uk">
    <meta charset="UTF-8">
    <title>My Page</title>
	<link rel="stylesheet" type="text/css" href="main.css" />
</head>
<body>
	<div class="main-container">

		<div class="left-column">

			<div class="add-item-section">
    			<input type="text" placeholder="Назва товару">
    			<button class="btn-add" data-tooltip="Додати новий товар">Додати</button>
			</div>
	
			<div class="product-item">
				<span class="product-name">Печиво</span>

				<div class="product-controls">
    				<button class="btn-minus" data-tooltip="Зменшити кількість">-</button>
    				<span class="amount">4</span>
    				<button class="btn-plus" data-tooltip="Збільшити кількість">+</button>
    				<button class="btn-status" data-tooltip="Відмітити як куплене">Не куплено</button>
    				<button class="btn-delete" data-tooltip="Видалити товар">x</button>
				</div>
			</div>
			<div class="product-item">
				<span class="product-name">Сир</span>

				<div class="product-controls">
					<button class="btn-minus" data-tooltip="Зменшити кількість">-</button>
					<span class="amount">2</span>
					<button class="btn-plus" data-tooltip="Збільшити кількість">+</button>
					<button class="btn-status" data-tooltip="Відмітити як куплене">Куплено</button>
					<button class="btn-delete" data-tooltip="Видалити товар">x</button>
			</div>	
			</div>

		</div>
		<div class="right-column">
    			<h2>Залишилося</h2>
    		<div class="stats-container">
        		<span class="stat-badge">Печиво <span class="stat-amount">2</span></span>
        		<span class="stat-badge">Сир <span class="stat-amount">1</span></span>
    		</div>

    			<h2>Куплено</h2>
    		<div class="stats-container">
        		<span class="stat-badge is-bought">Помідори <span class="stat-amount">2</span></span>
    		</div>
</div>
    </div>
	<div class="badge">
		<span class="badge-title">BuyList</span>
		<span class="badge-author">Робота: Фрейліхман Єлізавета</span>
	</div>
</body>
</html>
